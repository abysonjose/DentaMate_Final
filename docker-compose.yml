services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: dentamate-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db

  # Redis for caching and sessions
  redis:
    image: redis:7.2-alpine
    container_name: dentamate-redis
    restart: always
    ports:
      - "6379:6379"

  # API Gateway (Node.js)
  api-gateway:
    build: ./backend/api-gateway
    container_name: dentamate-api-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/dentamate?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-key
    depends_on:
      - mongodb
      - redis

  # Auth Identity Service
  auth-service:
    build: ./backend/auth-identity-service
    container_name: dentamate-auth-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/dentamate?authSource=admin
      - JWT_SECRET=your-jwt-secret-key
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - mongodb

  # Appointment Scheduling Service (Spring Boot)
  appointment-service:
    build: ./backend/appointment-scheduling-service
    container_name: dentamate-appointment-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=development
      - SPRING_DATA_MONGODB_URI=mongodb://admin:password@mongodb:27017/dentamate?authSource=admin
    depends_on:
      - mongodb

  # AI Diagnosis Service (Python)
  ai-diagnosis-service:
    build: ./backend/ai-diagnosis-service
    container_name: dentamate-ai-service
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/dentamate?authSource=admin
    depends_on:
      - mongodb

  # Prescription OCR Service (Python)
  prescription-ocr-service:
    build: ./backend/prescription-ocr-service
    container_name: dentamate-prescription-ocr-service
    restart: always
    ports:
      - "8007:8007"
    environment:
      - DEBUG=false
      - MONGODB_URL=mongodb://admin:password@mongodb:27017/dentamate_prescription_ocr?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=your-jwt-secret-key
      - API_GATEWAY_URL=http://api-gateway:3000
      - PHARMACY_SERVICE_URL=http://pharmacy-service:8008
      - AUDIT_SERVICE_URL=http://audit-service:8009
      - LOG_LEVEL=info
    depends_on:
      - mongodb
      - redis
    volumes:
      - prescription_uploads:/app/uploads

  # Tenant Organization Service (Node.js)
  tenant-organization-service:
    build: ./backend/tenant-organization-service
    container_name: dentamate-tenant-org-service
    restart: always
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/dentamate_tenant_org?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-key
      - ENABLE_CACHE=true
      - LOG_LEVEL=info
    depends_on:
      - mongodb
      - redis

  # Token Queue Realtime Service (Node.js)
  token-queue-service:
    build: ./backend/token-queue-realtime-service
    container_name: dentamate-token-queue-service
    restart: always
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/dentamate_queue?authSource=admin
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-key
      - FRONTEND_URL=http://localhost:4200
      - APPOINTMENT_SERVICE_URL=http://appointment-service:8080
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - TENANT_SERVICE_URL=http://tenant-organization-service:3003
    depends_on:
      - mongodb
      - redis
      - tenant-organization-service

  # SaaS Admin Service (Node.js)
  saas-admin-service:
    build: ./backend/saas-admin-service
    container_name: dentamate-saas-admin-service
    restart: always
    ports:
      - "3021:3021"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/dentamate_saas_admin?authSource=admin
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-key
      - LOG_LEVEL=info
      - TENANT_SERVICE_URL=http://tenant-organization-service:3003
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      - mongodb
      - redis
      - tenant-organization-service

  # Nursing Care Service (Node.js)
  nursing-care-service:
    build: ./backend/nursing-care-service
    container_name: dentamate-nursing-care-service
    restart: always
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=development
      - PORT=3007
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/dentamate_nursing_care?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-jwt-secret-key
      - FRONTEND_URL=http://localhost:4200
      - API_GATEWAY_URL=http://api-gateway:3000
      - APPOINTMENT_SERVICE_URL=http://appointment-service:8080
      - TOKEN_QUEUE_SERVICE_URL=http://token-queue-service:3005
      - LOG_LEVEL=info
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    depends_on:
      - mongodb
      - redis
      - tenant-organization-service

  # Frontend (Angular)
  frontend:
    build: ./frontend
    container_name: dentamate-frontend
    restart: always
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - API_BASE_URL=http://localhost:3000
    depends_on:
      - api-gateway

volumes:
  mongodb_data:
  prescription_uploads: