apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-organization-service
  labels:
    app: tenant-organization-service
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-organization-service
  template:
    metadata:
      labels:
        app: tenant-organization-service
    spec:
      containers:
      - name: tenant-organization-service
        image: dentamate-tenant-org-service:latest
        ports:
        - containerPort: 3003
        env:
        - name: MONGODB_URI
          value: "mongodb+srv://abyjp16:abyjp16@cluster0.ozkxezh.mongodb.net/?appName=Cluster0"
        - name: REDIS_URL
          value: "redis://redis:6379"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: tenant-organization-service
  labels:
    app: tenant-organization-service
spec:
  type: ClusterIP
  ports:
  - port: 3003
    targetPort: 3003
    protocol: TCP
  selector:
    app: tenant-organization-service