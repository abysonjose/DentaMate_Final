apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-staff-service
  labels:
    app: user-staff-service
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-staff-service
  template:
    metadata:
      labels:
        app: user-staff-service
    spec:
      containers:
      - name: user-staff-service
        image: dentamate-user-staff-service:latest
        ports:
        - containerPort: 3004
        env:
        - name: MONGODB_URI
          value: "mongodb+srv://username:password@cluster0.ozkxezh.mongodb.net/?appName=Cluster0"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3001"
        - name: TENANT_SERVICE_URL
          value: "http://tenant-organization-service:3003"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3004
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: user-staff-service
  labels:
    app: user-staff-service
spec:
  type: ClusterIP
  ports:
  - port: 3004
    targetPort: 3004
    protocol: TCP
  selector:
    app: user-staff-service