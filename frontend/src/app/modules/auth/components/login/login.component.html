<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header class="login-header">
      <div class="logo-container">
        <mat-icon class="logo-icon">local_hospital</mat-icon>
        <h1>DentaMate</h1>
      </div>
      <mat-card-subtitle>Dental Clinic Management System</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
        <!-- Tenant Selection -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Select Clinic/Organization</mat-label>
          <mat-select formControlName="tenantId">
            <mat-option *ngFor="let tenant of tenants" [value]="tenant.id">
              {{tenant.name}}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="loginForm.get('tenantId')?.invalid && loginForm.get('tenantId')?.touched">
            {{getErrorMessage('tenantId')}}
          </mat-error>
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            {{getErrorMessage('email')}}
          </mat-error>
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            {{getErrorMessage('password')}}
          </mat-error>
        </mat-form-field>

        <!-- Login Button -->
        <button 
          mat-raised-button 
          color="primary" 
          type="submit" 
          class="login-button full-width"
          [disabled]="isLoading">
          <mat-spinner *ngIf="isLoading" diameter="20" class="button-spinner"></mat-spinner>
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading">Signing In...</span>
        </button>

        <!-- Register Link -->
        <div class="register-link">
          <p>Don't have an account? 
            <button mat-button color="primary" type="button" (click)="onRegister()">
              Register here
            </button>
          </p>
        </div>

        <!-- Forgot Password Link -->
        <div class="forgot-password-link">
          <button mat-button color="accent" type="button">
            Forgot Password?
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
